<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Bontools </title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  
  /* LINK GAME FULL MÀN HÌNH (Vẫn giữ nhưng sẽ ẩn đi trên Safari) */
  #siteFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 0; display: none; }

  /* NÚT BÁNH RĂNG (CÀI ĐẶT) */
  #settingsBtn {
    position: fixed; top: 15px; right: 15px; z-index: 99998;
    width: 45px; height: 45px; border-radius: 50%;
    background: #000; border: 2px solid #00ffff;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 15px rgba(0,255,255,0.4); cursor: pointer;
    transition: transform 0.3s ease;
  }
  #settingsBtn:active { transform: scale(0.9) rotate(90deg); }
  #settingsBtn svg { width: 24px; height: 24px; fill: #00ffff; }

  /* LỚP PHỦ MENU (OVERLAY) */
  #loginOverlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: all 0.3s ease;
  }
  #loginOverlay.active { opacity: 1; visibility: visible; }

  /* KHUNG MENU CHÍNH */
  .box-key { 
    background: #0d0a12; 
    border-radius: 12px; 
    border: 2px solid #ff3399; 
    box-shadow: 0 0 20px rgba(255,51,153,0.4), inset 0 0 10px rgba(255,51,153,0.1); 
    max-width: 310px; 
    width: 100%; 
    position: relative;
    overflow: hidden;
    transform: translateY(20px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #loginOverlay.active .box-key { transform: translateY(0) scale(1); }

  .close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #ff3333; color: #fff; font-weight: bold; font-size: 14px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; z-index: 10; border: 2px solid #0d0a12;
    box-shadow: 0 0 10px rgba(255,51,51,0.5);
  }

  .brand-title { 
    text-align: center; color: #00ffff; font-size: 13px; font-weight: bold; 
    padding: 14px 30px;
    background: linear-gradient(90deg, rgba(255,51,153,0.2) 0%, rgba(0,255,255,0.1) 100%);
    text-transform: uppercase; text-shadow: 0 0 8px rgba(0,255,255,0.6); 
    letter-spacing: 1px; border-bottom: 1px solid #ff3399;
  }

  .menu-content { padding: 12px; }

  .price-title { color: #ff3399; text-align: center; font-weight: bold; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
  .price-board { border: 1px solid #222; border-radius: 6px; overflow: hidden; margin-bottom: 12px; background: #000; }
  .price-row { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #222; font-size: 13px; font-weight: bold; color: #fff; }
  .price-row:last-child { border-bottom: none; }
  .price-row span:last-child { color: #ffd700; }

  .activate-title { color: #ff3399; font-size: 13px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
  .input-group { display: flex; gap: 6px; margin-bottom: 10px; }
  .input-group input { flex: 1; padding: 8px 10px; border: 1px solid #00ffff; background: #000; color: #fff; border-radius: 6px; font-size: 13px; outline: none; }
  .input-group button { 
    padding: 0 12px; background: #ffb3d9; color: #000; border: none; border-radius: 6px; 
    font-weight: bold; cursor: pointer; font-size: 12px; display: flex; justify-content: center; align-items: center; min-width: 80px;
  }
  .input-group button:disabled { opacity: 0.8; cursor: not-allowed; background: #888; color: #fff; }
  .spinner { width: 14px; height: 14px; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; display: none; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .btn-warning { width: 100%; padding: 8px; background: #111; border: 1px solid #00ffff; color: #00ffff; border-radius: 6px; font-weight: bold; font-size: 12px; text-align: center; cursor: pointer; margin-bottom: 12px; text-transform: uppercase; }
  .contact-menu { display: flex; flex-direction: column; gap: 6px; }
  .menu-item { display: flex; align-items: center; gap: 8px; background: #111a1a; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: #fff; font-weight: bold; font-size: 13px; border: 1px solid #1a3333; }
  .menu-item img { width: 16px; height: 16px; }
  #errorMsg { color: #ff3333; font-size: 12px; text-align: center; margin-bottom: 8px; display: none; font-weight: bold; }

  /* THANH ĐIỀU KHIỂN TOOL */
  .control-panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.5s ease; }
  .control-panel.active { opacity: 1; visibility: visible; }
  .ctrl-btn { background: rgba(20, 20, 20, 0.8); border: 1px solid #ff1a8c; color: #fff; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; backdrop-filter: blur(4px); transition: 0.2s; }
  .ctrl-btn.hidden-tool { opacity: 0.4; border-color: #444; }

  /* ROBOT */
  .robot-wrapper { position: fixed; z-index: 99; user-select: none; touch-action: none; cursor: grab; opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0.6s ease; }
  .robot-wrapper.show { opacity: 1; visibility: visible; }
  .robot-wrapper.is-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none; }
  #robotMd5 { left: 5%; top: 10%; }
  #robotHu { left: 5%; bottom: 15%; top: auto; }
  
  .ai-robot-container { position: relative; width: 100vw; max-width: 500px; height: 380px; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .ai-floating-group { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; animation: floating 3s ease-in-out infinite; pointer-events: auto; }
  @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
  .ai-robot-img { width: 440px; height: auto; pointer-events: none; position: absolute; left: 50%; transform: translateX(-55%); top: -30px; z-index: 2; filter: drop-shadow(0 0 15px rgba(255, 26, 140, 0.9)); }
  
  .ai-panel { position: absolute; left: 50%; transform: translateX(-15%); top: 118px; width: 175px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; color: #fff; z-index: 3; }
  .ai-data-content { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .ai-info-row { display: flex; align-items: center; justify-content: space-between; font-size: 14.5px; font-weight: 800; white-space: nowrap; width: 100%; text-shadow: 1px 1px 3px #000; }
  .ai-label { color: #e2e8f0; padding-left: 5px; }
  .ai-value { font-weight: 900; font-size: 16.5px; text-align: right; padding-right: 5px; }
  .color-tai { color: #22d3ee; text-shadow: 0 0 8px #22d3ee; }
  .color-xiu { color: #ff1a8c; text-shadow: 0 0 8px #ff1a8c; }
  .conf-50-60  { color: #94a3b8; }
  .conf-60-70  { color: #38bdf8; }
  .conf-70-90  { color: #22c55e; }
  .conf-90-100 { color: #facc15; font-weight: 900; }

  @media (max-width: 600px) {
    .ai-robot-container { height: 340px; }
    .ai-robot-img { width: 390px; top: -20px; }
    .ai-panel { top: 105px; width: 160px; transform: translateX(-12%); }
    .ai-info-row { font-size: 13.5px; }
    .ai-value { font-size: 15.5px; }
  }
</style>
</head>

<script>
// ⚠️ LINK BACKEND CỦA BẠN
const BACKEND_URL = "https://bontooltxios.onrender.com/"; 
const GAME_URL = "https://lc79b.bet"; // Link game chuyển hướng

const POLL_INTERVAL_MS = 1000;
const API_MD5 = "https://leminhmd5.onrender.com/lc79md5";
const API_HU  = "https://miinhexiutxthuong.onrender.com/lc79hu";

let isToolInit = false;
let isLoggingIn = false;

// 🔥 FIX LỖI SAFARI: Ẩn iframe nếu là Safari/iOS và dùng chuyển hướng
const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent) || /iPad|iPhone|iPod/.test(navigator.userAgent);
if (isSafari) {
  document.getElementById('siteFrame').style.display = 'none';
  // Tự động chuyển hướng sang game sau khi tải tool 1 nhịp
  setTimeout(() => { window.location.href = GAME_URL; }, 1500); 
} else {
  document.getElementById('siteFrame').style.display = 'block';
}

const stateMd5 = { isFetching:false, currentId:null, errorCount:0, history:[], lastConf:null, lastBucket:null,
  els:{ session:document.getElementById('md5-session'), prediction:document.getElementById('md5-prediction'), confidence:document.getElementById('md5-confidence') } };

const stateHu = { isFetching:false, currentId:null, errorCount:0, history:[], lastConf:null, lastBucket:null,
  els:{ session:document.getElementById('hu-session'), prediction:document.getElementById('hu-prediction'), confidence:document.getElementById('hu-confidence') } };

window.onload = function() {
  const savedKey = localStorage.getItem('vip_key');
  if (savedKey) startTool();
}

function openLogin(){ document.getElementById('loginOverlay').classList.add('active'); }
function closeLogin(e){ if(e) e.stopPropagation(); document.getElementById('loginOverlay').classList.remove('active'); }

function toggleTool(wrapperId, btnElement){
  const wrapper = document.getElementById(wrapperId);
  const isHidden = wrapper.classList.toggle('is-hidden');
  btnElement.classList.toggle('hidden-tool', isHidden);
}

async function submitKey() {
  if (isLoggingIn) return;
  const key = document.getElementById('keyInput').value.trim();
  const errEl = document.getElementById('errorMsg');
  const btn = document.getElementById('btnActivate');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('loadingSpinner');
  
  if (!key) { errEl.innerText = "Vui lòng nhập key!"; errEl.style.display='block'; return; }

  isLoggingIn = true;
  btn.disabled = true; btnText.innerText = "ĐANG KẾT NỐI"; spinner.style.display='block'; errEl.style.display='none';

  try {
    const res = await fetch(`${BACKEND_URL}api/activate`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key })
    });
    if (!res.ok) throw new Error("Server Error");
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('vip_key', key);
      closeLogin(); startTool();
    } else {
      errEl.innerText = data.msg || "Key không hợp lệ!";
      errEl.style.display='block';
      btnText.innerText = "ĐĂNG NHẬP"; spinner.style.display='none'; btn.disabled = false;
    }
  } catch(e) {
    errEl.innerText = "Lỗi kết nối Server! (Vui lòng đợi 30s do Render khởi động)";
    errEl.style.display='block';
    btnText.innerText = "ĐĂNG NHẬP"; spinner.style.display='none'; btn.disabled = false;
  } finally {
    isLoggingIn = false;
  }
}

function logout(){
  if(confirm("Bạn có chắc muốn đăng xuất?")){
    localStorage.removeItem('vip_key'); location.reload();
  }
}

function startTool(){
  setTimeout(()=>document.getElementById('controlPanel').classList.add('active'),100);
  setTimeout(()=>{
    document.getElementById('robotMd5').classList.add('show');
    document.getElementById('robotHu').classList.add('show');
  },300);

  if(!isToolInit){
    isToolInit = true;
    setupDrag('robotMd5','containerMd5');
    setupDrag('robotHu','containerHu');
    fetchApi(API_MD5, stateMd5);
    fetchApi(API_HU,  stateHu);
    setInterval(()=>{
      fetchApi(API_MD5, stateMd5);
      fetchApi(API_HU,  stateHu);
    }, POLL_INTERVAL_MS);
  }
}

function flash(el){ if(!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

function parseTX(v){
  if(!v) return null;
  const s = String(v).trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Đ/g,'D');
  if(s.includes('TAI')||s==='T'||s.includes('BIG')) return 'T';
  if(s.includes('XIU')||s==='X'||s.includes('SMALL')) return 'X';
  return null;
}

function rawParseConf(v){
  if(v===null||v===undefined) return null;
  if(typeof v==='number') return v<=1 ? v*100 : v;
  const n = parseFloat(String(v).replace(',','.').replace('%',''));
  if(isNaN(n)) return null;
  return n<=1 ? n*100 : n;
}

function bucketConfidence(rawConf, state){
  if(rawConf===null || isNaN(rawConf)) rawConf = 55;
  rawConf = Math.max(0, Math.min(100, rawConf));
  state.history.push(rawConf);
  if(state.history.length > 5) state.history.shift();
  const smoothed = state.history.reduce((a,b)=>a+b,0) / state.history.length;
  let bucket = smoothed < 65 ? 'low' : (smoothed < 85 ? 'mid' : 'high');
  if(state.lastBucket === bucket && state.lastConf !== null) return state.lastConf;
  let finalConf = bucket === 'low' ? 50+Math.random()*10.9 : (bucket === 'mid' ? 70+Math.random()*10.9 : 80+Math.random()*19.9);
  finalConf = Math.round(finalConf*10)/10;
  if(bucket === 'low') finalConf = Math.min(60.9, Math.max(50.0, finalConf));
  else if(bucket === 'mid') finalConf = Math.min(80.9, Math.max(70.0, finalConf));
  else finalConf = Math.min(99.9, Math.max(80.0, finalConf));
  state.lastBucket = bucket;
  state.lastConf = finalConf;
  return finalConf;
}

function getConfClass(conf){
  if(conf >= 90) return 'conf-90-100';
  if(conf >= 70) return 'conf-70-90';
  if(conf >= 60) return 'conf-60-70';
  return 'conf-50-60';
}

async function fetchWithRetry(url, retries = 2, timeout = 4000) {
  for (let i = 0; i <= retries; i++) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      const res = await fetch(`${url}?_t=${Date.now()}`, {
        cache:'no-store', signal: controller.signal,
        headers:{ 'Accept':'application/json' }
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      if (i === retries) return null;
      await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
}

async function fetchApi(url, state) {
  if (state.isFetching) return;
  state.isFetching = true;
  try {
    const json = await fetchWithRetry(url);
    if (!json) {
      state.errorCount++;
      if (state.errorCount >= 3) {
        state.els.prediction.textContent = 'Lỗi mạng';
        state.els.prediction.className = 'ai-value conf-50-60';
        state.els.confidence.textContent = '--';
        state.els.confidence.className = 'ai-value conf-50-60';
      }
      return;
    }
    state.errorCount = 0;
    const phien = json.Phien ?? json.phien;
    const rawDuDoan = json.Du_doan ?? json.du_doan ?? json.Ket_qua_du_doan;
    const duDoan = parseTX(rawDuDoan);
    const rawConf = rawParseConf(json.Do_tin_cay ?? json.do_tin_cay);
    if (!phien || !duDoan) return;
    const conf = bucketConfidence(rawConf, state);
    if (state.currentId !== phien) {
      state.currentId = phien;
      state.els.session.textContent = '#' + phien;
      state.els.prediction.textContent = duDoan === 'T' ? 'Tài' : 'Xỉu';
      state.els.prediction.className = 'ai-value ' + (duDoan === 'T' ? 'color-tai' : 'color-xiu');
      state.els.confidence.textContent = conf.toFixed(1) + '%';
      state.els.confidence.className = 'ai-value ' + getConfClass(conf);
      flash(state.els.session);
      flash(state.els.prediction);
      flash(state.els.confidence);
    }
  } catch (e) {} finally { state.isFetching = false; }
}

function setupDrag(wrapperId, containerId) {
  const widget = document.getElementById(wrapperId);
  const container = document.getElementById(containerId);
  let pos1=0, pos2=0, pos3=0, pos4=0, isDragging=false;

  container.addEventListener('pointerdown', (e) => {
    if (widget.classList.contains('is-hidden')) return;
    isDragging = true;
    document.querySelectorAll('.robot-wrapper').forEach(el => el.style.zIndex='99');
    widget.style.zIndex = '100';
    const rect = widget.getBoundingClientRect();
    widget.style.transform = 'none';
    widget.style.left = rect.left + 'px';
    widget.style.top  = rect.top  + 'px';
    widget.style.bottom = 'auto';
    pos3 = e.clientX; pos4 = e.clientY;
    document.addEventListener('pointermove', onDrag);
    document.addEventListener('pointerup', onDrop);
  });

  function onDrag(e){
    if(!isDragging) return;
    e.preventDefault();
    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
    pos3 = e.clientX; pos4 = e.clientY;
    let top  = widget.offsetTop  - pos2;
    let left = widget.offsetLeft - pos1;
    top  = Math.max(0, Math.min(top,  window.innerHeight - widget.offsetHeight));
    left = Math.max(0, Math.min(left, window.innerWidth  - widget.offsetWidth));
    widget.style.top  = top  + 'px';
    widget.style.left = left + 'px';
  }

  function onDrop(){
    isDragging = false;
    document.removeEventListener('pointermove', onDrag);
    document.removeEventListener('pointerup', onDrop);
  }
}
</script>
